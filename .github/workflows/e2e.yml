name: E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# bash with pipefail: "playwright test | tee" must still fail the job when a test fails.
defaults:
  run:
    shell: bash

jobs:
  money-path:
    name: Money path end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookshop
          POSTGRES_PASSWORD: bookshop
          POSTGRES_DB: bookshop_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookshop -d bookshop_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: danishsary8/bookly_backend_v2
          ref: main
          path: backend
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: |
          cd backend
          composer install --prefer-dist --no-interaction --no-progress

      - name: Configure and seed backend database
        run: |
          cd backend
          cp .env.example .env
          sed -i 's/DB_DATABASE=bookshop_v2/DB_DATABASE=bookshop_v2_test/' .env
          sed -i 's/QUEUE_CONNECTION=database/QUEUE_CONNECTION=sync/' .env
          sed -i 's/MAIL_MAILER=.*/MAIL_MAILER=log/' .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --class=DemoSeeder --force

      - name: Seed test staff 2FA and prepare session token
        run: |
          cd backend
          php artisan tinker --execute='$u = App\Models\StaffUser::where("email", "admin@bookly.test")->first(); $secret = app(App\Services\Auth\TotpService::class)->generateSecret(); $u->update(["two_factor_enabled" => true, "two_factor_secret" => $secret]); $t = $u->createToken("e2e", $u->tokenAbilities())->plainTextToken; file_put_contents("token.txt", $t); file_put_contents("secret.txt", $secret);'
          TOKEN=$(cat token.txt)
          SECRET=$(cat secret.txt)
          echo "STAFF_BEARER_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "E2E_STAFF_TOTP_SECRET=$SECRET" >> $GITHUB_ENV
          echo "E2E_STAFF_PASSWORD=Password123!" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium --with-deps

      - name: Start servers and run Playwright tests
        run: |
          # Start Laravel API server
          cd backend
          nohup php artisan serve --host=127.0.0.1 --port=8000 > /tmp/artisan.log 2>&1 &
          disown
          cd ..

          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/api/v1/ping >/dev/null; then
              echo "Laravel API is responding."
              break
            fi
            sleep 1
          done
          if ! curl -fs http://127.0.0.1:8000/api/v1/ping >/dev/null; then
            echo "Laravel API failed to start:"
            cat /tmp/artisan.log
            exit 1
          fi

          # Generate staff session payload
          TOKEN="${STAFF_BEARER_TOKEN}"
          USER_JSON=$(curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8000/api/v1/staff/auth/me | jq -c '.data')
          export E2E_STAFF_SESSION=$(jq -n --arg token "$TOKEN" --argjson user "$USER_JSON" '{token: $token, expiresAt: null, user: $user}')

          # Start Vite frontend server
          VITE_API_BASE_URL=http://127.0.0.1:8000/api/v1 nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/vite.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:5173 >/dev/null; then
              echo "Vite server is responding."
              break
            fi
            sleep 1
          done
          if ! curl -fs http://127.0.0.1:5173 >/dev/null; then
            echo "Vite server failed to start:"
            cat /tmp/vite.log
            exit 1
          fi

          # Run Playwright tests
          npx playwright test e2e/smoke.spec.ts 2>&1 | tee /tmp/playwright.log
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_URL: http://127.0.0.1:8000/api/v1
          E2E_STAFF_EMAIL: admin@bookly.test
          E2E_STAFF_PASSWORD: ${{ env.E2E_STAFF_PASSWORD }}
          E2E_STAFF_TOTP_SECRET: ${{ env.E2E_STAFF_TOTP_SECRET }}

      - name: Show server logs on failure
        if: failure()
        run: |
          {
            echo "## Failure Diagnostics"
            echo "### Playwright log"
            echo '```'
            tail -n 100 /tmp/playwright.log 2>/dev/null || echo "No playwright log"
            echo '```'
            echo "### Laravel API log"
            echo '```'
            cat /tmp/artisan.log 2>/dev/null || echo "No artisan log"
            echo '```'
            echo "### Vite log"
            echo '```'
            cat /tmp/vite.log 2>/dev/null || echo "No vite log"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
