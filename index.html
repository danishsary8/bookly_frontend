<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookly · Books delivered across Cambodia</title>
    <meta name="description" content="Bookly is an online bookshop in Cambodia: paperbacks, hardcovers and ebooks, prices in dollars or riel, delivered to your door with cash on delivery." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#14207A" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bookly" />
    <meta property="og:title" content="Bookly · Books delivered across Cambodia" />
    <meta property="og:description" content="Paperbacks, hardcovers and ebooks, delivered across Cambodia. Pay cash on delivery." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bookly: books delivered across Cambodia" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: connect early and load in parallel with the app's CSS (an @import would wait for it). -->
    <!-- Splash: minimal Lapis & Paper loading screen matching MASTER.md tokens (exited by src/lib/splash.ts). -->
    <script src="/splash-boot.js"></script>
    <style>
      #splash { display: none; }
      [data-splash] #splash {
        --sp-bg: #F6F7FB; --sp-card: #FFFFFF; --sp-ink: #0E1335; --sp-muted: #4C5378;
        --sp-primary: #14207A; --sp-accent: #FF4F2E; --sp-border: #D9DDEC; --sp-track: #E6E9F8;
        --sp-ease: cubic-bezier(0.22, 1, 0.36, 1);
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden;
        background: var(--sp-bg);
      }
      [data-splash="dark"] #splash {
        --sp-bg: #070B22; --sp-card: #0E1433; --sp-ink: #F1F2FA; --sp-muted: #A9B0D6;
        --sp-primary: #9AA6FF; --sp-accent: #FF4F2E; --sp-border: #252D63; --sp-track: #172050;
      }
      #splash::before {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(48% 36% at 50% 44%, rgb(20 32 122 / 0.06), transparent 72%);
      }
      [data-splash="dark"] #splash::before {
        background: radial-gradient(48% 36% at 50% 44%, rgb(38 57 158 / 0.28), transparent 72%);
      }
      #splash.is-leaving { animation: sp-exit 320ms var(--sp-ease) both; pointer-events: none; }

      .sp-stage {
        position: relative; display: grid; justify-items: center; gap: 14px; padding: 24px;
        animation: sp-in 420ms var(--sp-ease) both;
      }
      .sp-mark {
        display: grid; place-items: center; width: 68px; height: 68px; border-radius: 18px;
        background: var(--sp-card); border: 1px solid var(--sp-border);
        box-shadow: 0 12px 32px -12px rgb(14 19 53 / 0.14);
      }
      [data-splash="dark"] .sp-mark { box-shadow: 0 14px 36px -12px rgb(0 0 0 / 0.55); }
      .sp-book { width: 34px; height: 28px; overflow: visible; }
      .sp-book .sp-stroke {
        fill: none; stroke: var(--sp-primary); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-draw 520ms var(--sp-ease) 80ms both;
      }
      .sp-book .sp-ribbon {
        fill: var(--sp-accent); transform-box: fill-box; transform-origin: 50% 0;
        animation: sp-drop 320ms var(--sp-ease) 300ms both;
      }

      .sp-name {
        margin-top: 4px; color: var(--sp-ink);
        font: 400 clamp(2rem, 6vw, 2.75rem)/1.05 "Gloock", Georgia, serif; letter-spacing: 0.01em;
        animation: sp-rise 380ms var(--sp-ease) 140ms both;
      }
      .sp-tagline {
        margin: 0; min-height: 1.5em; color: var(--sp-muted); text-align: center;
        font: 500 0.9375rem/1.5 "Hanken Grotesk", "Kantumruy Pro", system-ui, sans-serif;
        animation: sp-rise 380ms var(--sp-ease) 220ms both;
      }
      .sp-loader {
        position: relative; margin-top: 8px; width: 120px; height: 3px; border-radius: 999px; overflow: hidden;
        background: var(--sp-track); animation: sp-fade 300ms ease 260ms both;
      }
      .sp-loader::before {
        content: ""; position: absolute; inset-block: 0; left: 0; width: 42%; border-radius: inherit;
        background: var(--sp-primary); animation: sp-load 1050ms var(--sp-ease) infinite;
      }
      .sp-foot {
        position: absolute; left: 0; right: 0; bottom: clamp(24px, 5vw, 40px); margin: 0; padding: 0 24px;
        text-align: center; color: var(--sp-muted); min-height: 1.5em; opacity: 0.85;
        font: 600 0.72rem/1.5 "Hanken Grotesk", "Kantumruy Pro", system-ui, sans-serif;
        letter-spacing: 0.16em; text-transform: uppercase;
        animation: sp-fade 420ms ease 280ms both;
      }
      .sp-tagline:lang(km), .sp-foot:lang(km) { font-family: "Kantumruy Pro", system-ui, sans-serif; line-height: 1.85; letter-spacing: 0; text-transform: none; }

      @keyframes sp-in { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: none; } }
      @keyframes sp-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-drop { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes sp-load { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @keyframes sp-exit { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.985); visibility: hidden; } }

      /* Reduced motion: clean static screen, instant fade out. */
      [data-splash-still] #splash *, [data-splash-still] #splash *::before { animation: none !important; }
      [data-splash-still] .sp-book .sp-stroke { stroke-dashoffset: 0; }
      [data-splash-still] .sp-loader::before { width: 100%; transform: none; opacity: 0.55; }
      [data-splash-still] #splash.is-leaving { animation: none; opacity: 0; visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-stage">
        <div class="sp-mark">
          <svg class="sp-book" viewBox="0 0 36 30" width="36" height="30" focusable="false">
            <path class="sp-stroke" pathLength="1" d="M18 25.5C14 22.8 8.5 22.2 3 23.5V5.5C8.5 4.2 14 4.8 18 7.5C22 4.8 27.5 4.2 33 5.5V23.5C27.5 22.2 22 22.8 18 25.5Z" />
            <path class="sp-stroke" pathLength="1" d="M18 7.5V25.5" />
            <path class="sp-ribbon" d="M21 5.6H24.6V17.4L22.8 15.8L21 17.4Z" />
          </svg>
        </div>
        <span class="sp-name" data-splash-name>Bookly</span>
        <p class="sp-tagline" data-splash-tagline></p>
        <span class="sp-loader"></span>
      </div>
      <p class="sp-foot" data-splash-foot></p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
